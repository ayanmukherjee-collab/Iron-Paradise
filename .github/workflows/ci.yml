name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values so the app builds. None of these reach a real service.
env:
  NEXT_PUBLIC_SITE_URL: http://localhost:4173
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Includes the RLS security tests, run against the real migrations in
      # an in-memory Postgres.
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Static site and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same build Cloudflare runs, then a deploy dry run of web/dist.
      - run: npm run cf:build
      - run: npx wrangler deploy --dry-run
      # The committed Edge Function bundles must match their sources.
      - run: npm run fn:build
      - run: git diff --exit-code -- supabase/functions
