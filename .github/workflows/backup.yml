name: Nightly database backup

# Supabase's free plan keeps no backups, so this does it: a full dump every
# night, encrypted before it leaves the runner, stored in Cloudflare R2.
# Restore steps: docs/backup-and-restore.md.

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in SUPABASE_DB_URL BACKUP_PASSPHRASE R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Backup skipped. Missing repository secrets:$missing (see docs/backup-and-restore.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Dump roles, schema and data
        if: steps.config.outputs.ready == 'true'
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql

      - name: Encrypt
        if: steps.config.outputs.ready == 'true'
        run: |
          name="iron-paradise-$(date -u +%Y-%m-%dT%H%MZ).tar.gz.gpg"
          tar -czf - -C backup . \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                  --passphrase "$BACKUP_PASSPHRASE" -o "$name"
          rm -rf backup
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Upload to R2
        if: steps.config.outputs.ready == 'true'
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/nightly/$BACKUP_FILE" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          echo "Uploaded $BACKUP_FILE"
